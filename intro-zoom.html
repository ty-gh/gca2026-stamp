<html lang="ja">

<title>導入-2〜7 スマホの中へ近づく — 親子で学ぶ、半導体の世界。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  GCA2026秋 出張 高専ラボ with ICTパーク（11/7・8 泉佐野オチアリーナ）
  進行台本の「導入-2 スマホ」〜「導入-7 スイッチ」（スライド PDF にないパート）のアニメーション。
  スタンプ集め（index.html）とは別の 1 ファイル。ローカルでこのファイルを開いて再生する（file:// で動く。サーバー不要、外部ライブラリなし。フォントだけ Google Fonts。届かなければ端末のフォント）

  台本との対応（クリック / スペース / → で 1 つ進む。「近づきます」が合図）
    1 導入-2 スマホ       ゲームも、動画も、カメラも、この1台で。どんどん近づいて覗いてみます
    2 導入-3 中の板       ふたを開けると、部品がびっしり。一番大事なのは、この黒い四角（数秒後に黒い四角に輪がつく）
    3 導入-4 チップ       これがチップ。大きさは、つめくらい（数秒後にふたが開く）。もっと近づきます
    4 導入-5 チップの中   町の地図みたい。区画がたくさん（数秒後にまん中の区画に輪）
    5 導入-6 区画の中     細い線と、小さな部品がびっしり（数秒後にまん中の部品に輪）
    6 導入-7 スイッチ     「一番奥にいたのは……」で止まる（溜め）
    7                     → クリックで「スイッチ 1個」が現れる
    8                     → クリックでオン / オフを切り替え始める
    9                     → クリックで「1 たす 1 どころか、ひとりでは何も計算できません」
  最後まで行ったら、スライド（導入-8 レッドストーントーチ）へ切り替える

  操作: クリック / タップ / スペース / → で つぎへ、← で もどる、Home で最初、F で全画面、A で自動再生（約 10 秒ずつ進み、最後で止まる）
        数字キー 1〜9 でその場面へ。URL に ?auto を付けると最初から自動再生
  画面は 16:9（1600×900 の座標系）で描き、窓の大きさに合わせて縮尺する。見た目はスタンプ集め・スライドと同じ theme "paper"
  場面と場面は「カメラのズーム」でつながる（前の場面の的を拡大しながら、次の場面を同じ位置に重ねて現す）。文は下の STEPS を直す
-->
<style>
  :root {
    --paper: #f4eee3; --ink: #1f2238; --dim: rgba(31, 34, 56, .55);
    --accent: #3557d4; --peach: #f6a97f; --lilac: #cbb8ef; --butter: #f3d98b; --mint: #8fd3b9; --red: #e2543c; --card: #f8f3ea;
    --font-en: "Outfit", "Helvetica Neue", Arial, sans-serif;
    --font-jp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    --fit: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #e9e2d4; overflow: hidden; }
  body { color: var(--ink); font-family: var(--font-jp); line-height: 1.5; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg text { font-family: var(--font-jp); }
  svg text.en { font-family: var(--font-en); }
  .caps { font: 500 13px/1 var(--font-en); letter-spacing: .32em; text-transform: uppercase; }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 90; pointer-events: none; mix-blend-mode: multiply; opacity: .45;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: scale(var(--fit)) translate(-50%, -50%); transform-origin: 0 0; background: var(--paper); overflow: hidden; }
  .layer { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; visibility: hidden; opacity: 0; will-change: transform, opacity; }
  .layer > svg.art { position: absolute; inset: 0; width: 1600px; height: 900px; display: block; overflow: visible; }
  .layer .html { position: absolute; }
  .blob { position: absolute; border-radius: 47% 53% 42% 58% / 52% 44% 56% 48%; animation: blob 14s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes blob { 33% { border-radius: 58% 42% 51% 49% / 44% 57% 43% 56%; } 66% { border-radius: 42% 58% 60% 40% / 56% 42% 58% 44%; } 100% { border-radius: 52% 48% 45% 55% / 47% 55% 45% 53%; } }
  .ringanim { animation: ring 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .fadein { opacity: 0; transition: opacity .5s ease; }

  /* 1 導入-2 スマホ */
  #L0 .blob-main { width: 560px; height: 500px; left: 520px; top: 180px; background: var(--peach); }
  #L0 .blob-bl { width: 460px; height: 320px; left: -160px; top: 720px; background: var(--lilac); }
  #L0 .blob-tr { width: 300px; height: 260px; left: 1380px; top: -90px; background: var(--butter); }
  #L0 .note { position: absolute; background: var(--card); border: 4px solid var(--ink); border-radius: 22px; padding: 12px 22px; font-size: 26px; font-weight: 900; box-shadow: 5px 5px 0 rgba(31, 34, 56, .16); white-space: nowrap; opacity: 0; transform: translateY(12px) scale(.9); transition: opacity .5s ease, transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  #L0 .note i { display: inline-block; width: 30px; height: 30px; border-radius: 9px; vertical-align: -6px; margin-right: 10px; border: 3px solid var(--ink); }
  .stage.step-0 #L0 .note { opacity: 1; transform: none; }
  .stage.step-0 #L0 .note:nth-of-type(1) { transition-delay: 1.2s; }
  .stage.step-0 #L0 .note:nth-of-type(2) { transition-delay: 1.7s; }
  .stage.step-0 #L0 .note:nth-of-type(3) { transition-delay: 2.2s; }
  #L0 .float { animation: float 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes float { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
  .stage:not(.step-0) #L0 .float { animation: none; }

  /* 2 導入-3 中の板 */
  #L1 .ring { opacity: 0; transition: opacity .5s ease; }
  #L1.ring .ring { opacity: 1; }
  #L1 .tag { left: 1040px; top: 290px; background: var(--card); border: 4px solid var(--ink); border-radius: 22px; padding: 12px 24px; font-size: 30px; font-weight: 900; box-shadow: 5px 5px 0 rgba(31, 34, 56, .16); white-space: nowrap; opacity: 0; transform: translateX(-14px); transition: opacity .5s ease .2s, transform .5s ease .2s; }
  #L1 .tag::before { content: ""; position: absolute; left: -30px; top: 50%; width: 30px; height: 4px; margin-top: -2px; background: var(--ink); }
  .stage.step-1 #L1.ring .tag { opacity: 1; transform: none; }
  .stage:not(.step-1) #L1 .tag { transition: opacity .3s ease; }

  /* 3 導入-4 チップ */
  #L2 .lid { transform-origin: 800px 450px; transition: transform 1.4s cubic-bezier(.4, 0, .2, 1), opacity 1.1s ease .3s; }
  #L2.open .lid { transform: translate(60px, -560px) rotate(-7deg); opacity: 0; }
  #L2 .shine { animation: shine 5s ease-in-out infinite alternate; }
  @keyframes shine { from { opacity: .14; } to { opacity: .3; } }
  #L2 .thumb { left: 40px; top: 560px; width: 330px; background: var(--card); border: 4px solid var(--ink); border-radius: 26px; padding: 16px 20px 14px; box-shadow: 6px 6px 0 rgba(31, 34, 56, .18); opacity: 0; transform: translateY(16px) scale(.92); transition: opacity .5s ease, transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  #L2 .thumb .caps { color: var(--accent); }
  #L2 .thumb p { font-size: 28px; font-weight: 900; margin-top: 6px; line-height: 1.3; }
  #L2 .thumb svg { display: block; width: 286px; height: 150px; margin-top: 8px; }
  .stage.step-2 #L2.thumb .thumb { opacity: 1; transform: none; }
  .stage:not(.step-2) #L2 .thumb { transition: opacity .3s ease; }

  /* 4 導入-5 チップの中（町の地図） / 5 導入-6 区画の中 */
  .focusring { opacity: 0; transition: opacity .5s ease; }
  .ring .focusring { opacity: 1; }
  #L4 .hair { left: 40px; top: 560px; width: 440px; background: var(--card); border: 4px solid var(--ink); border-radius: 26px; padding: 16px 22px 18px; box-shadow: 6px 6px 0 rgba(31, 34, 56, .18); opacity: 0; transform: translateY(16px) scale(.92); transition: opacity .5s ease, transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  #L4 .hair .caps { color: var(--accent); }
  #L4 .hair p { font-size: 24px; white-space: nowrap; font-weight: 900; margin-top: 6px; line-height: 1.35; }
  #L4 .hair p small { display: block; font-size: 17px; color: var(--dim); font-weight: 700; margin-top: 4px; }
  #L4 .hair svg { display: block; width: 392px; height: 96px; margin-top: 10px; }
  .stage.step-4 #L4.hair .hair { opacity: 1; transform: none; }
  .stage:not(.step-4) #L4 .hair { transition: opacity .3s ease; }
  .cell.blink .pad { animation: blink var(--d, 2s) ease-in-out var(--delay, 0s) infinite alternate; }
  @keyframes blink { 0%, 35% { fill: var(--mint); } 65%, 100% { fill: var(--butter); } }

  /* 6〜9 導入-7 スイッチ */
  #L5 .tr { transition: opacity 1s ease; }
  .stage.sw #L5 .tr { opacity: .1; }
  #L5 .swg { opacity: 0; transition: opacity 1s ease .3s; }
  .stage.sw #L5 .swg { opacity: 1; }
  #L5 .name { left: 40px; top: 140px; width: 330px; background: var(--card); border: 4px solid var(--ink); border-radius: 26px; padding: 18px 24px; box-shadow: 6px 6px 0 rgba(31, 34, 56, .18); font-size: 40px; font-weight: 900; line-height: 1.2; opacity: 0; transform: translateY(16px) scale(.92); transition: opacity .5s ease .8s, transform .5s cubic-bezier(.3, 1.4, .5, 1) .8s; }
  #L5 .name small { display: block; font-size: 19px; color: var(--dim); font-weight: 700; margin-top: 10px; line-height: 1.5; }
  .stage.sw #L5 .name { opacity: 1; transform: none; }
  .sw .lv-on { opacity: 0; } .sw .lv-off { opacity: 1; }
  .sw.on .lv-on { opacity: 1; } .sw.on .lv-off { opacity: 0; }
  .lamp .glow, .lamp .rays { opacity: 0; transition: opacity .3s ease; }
  .lamp .bulb { fill: #fff; transition: fill .3s ease; }
  .lamp.on .glow, .lamp.on .rays { opacity: 1; }
  .lamp.on .bulb { fill: var(--butter); }
  .wire { transition: stroke .3s ease; }
  .wire.live { stroke: var(--accent); }
  #L5 .lbl-on, #L5 .lbl-off { opacity: 0; transition: opacity .15s ease; }
  .stage.tog #L5 .lbl-off { opacity: 1; }
  .stage.tog #L5.on .lbl-on { opacity: 1; } .stage.tog #L5.on .lbl-off { opacity: 0; }
  #L5 .alone { left: 1120px; top: 120px; background: var(--card); border: 4px solid var(--ink); border-radius: 26px; padding: 18px 30px; box-shadow: 6px 6px 0 rgba(31, 34, 56, .18); text-align: center; opacity: 0; transform: rotate(6deg) scale(.6); transition: opacity .4s ease, transform .6s cubic-bezier(.3, 1.5, .5, 1); }
  #L5 .alone .eq { font: 800 92px/1 var(--font-en); letter-spacing: .02em; }
  #L5 .alone .eq b { color: var(--red); display: inline-block; animation: wob 1.6s ease-in-out infinite; }
  @keyframes wob { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  #L5 .alone p { font-size: 22px; font-weight: 900; color: var(--dim); margin-top: 10px; }
  .stage.alone #L5 .alone { opacity: 1; transform: rotate(4deg) scale(1); }

  /* 字幕・案内 */
  .cap { position: absolute; z-index: 20; left: 50%; bottom: 44px; transform: translateX(-50%); max-width: 1320px; background: var(--card); border: 4px solid var(--ink); border-radius: 26px; padding: 20px 40px; font-size: 36px; font-weight: 900; line-height: 1.5; text-align: center; box-shadow: 7px 7px 0 rgba(31, 34, 56, .18); opacity: 0; pointer-events: none; }
  .cap b { color: var(--accent); font-weight: 900; }
  .cap small { display: block; font-size: 22px; color: var(--dim); font-weight: 700; }
  .cap.show { animation: capIn .55s cubic-bezier(.3, 1.3, .5, 1) both; }
  @keyframes capIn { from { opacity: 0; transform: translate(-50%, 18px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .crumb { position: absolute; z-index: 20; left: 36px; top: 30px; display: flex; align-items: center; gap: 10px; font: 700 18px/1 var(--font-jp); color: var(--dim); }
  .crumb span { padding: 8px 14px; border-radius: 999px; border: 3px solid transparent; transition: all .4s ease; white-space: nowrap; }
  .crumb span.now { color: var(--ink); background: var(--butter); border-color: var(--ink); }
  .crumb i { font-style: normal; opacity: .5; }
  .size { position: absolute; z-index: 20; left: 36px; top: 84px; font: 700 18px/1 var(--font-jp); color: var(--accent); padding: 8px 14px; border: 3px solid var(--accent); border-radius: 999px; background: var(--card); opacity: 0; transition: opacity .4s ease; white-space: nowrap; }
  .size.show { opacity: 1; }
  .size .en { font-family: var(--font-en); letter-spacing: .04em; }
  .who { position: absolute; z-index: 20; right: 36px; top: 34px; font: 700 14px/1 var(--font-en); letter-spacing: .2em; color: var(--dim); }
  .nav { position: absolute; z-index: 20; right: 30px; bottom: 30px; display: flex; align-items: center; gap: 10px; }
  .dots { display: flex; gap: 8px; margin-right: 8px; }
  .dots button { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: var(--card); padding: 0; opacity: .5; transition: all .3s ease; }
  .dots button.now { background: var(--accent); border-color: var(--accent); opacity: 1; transform: scale(1.25); }
  .dots button.done { background: var(--ink); opacity: .35; }
  .nav .btn { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--card); display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 rgba(31, 34, 56, .18); color: var(--ink); }
  .nav .btn svg { width: 20px; height: 20px; display: block; }
  .nav .btn.auto.on { background: var(--butter); }
  .nav .btn .x { display: none; }
  html.is-fs .nav .btn.fs .o { display: none; } html.is-fs .nav .btn.fs .x { display: block; }
  .badge { position: absolute; z-index: 20; right: 36px; top: 64px; font: 700 14px/1 var(--font-en); letter-spacing: .24em; color: var(--accent); border: 3px solid var(--accent); border-radius: 999px; padding: 8px 14px; opacity: 0; transition: opacity .3s ease; }
  .badge.show { opacity: 1; }
  .hint { position: absolute; z-index: 20; left: 36px; bottom: 40px; font-size: 15px; color: var(--dim); letter-spacing: .04em; opacity: 0; transition: opacity .4s ease; }
  .stage.step-0 .hint { opacity: 1; }
  .hint kbd { font: 700 13px/1 var(--font-en); border: 2px solid rgba(31, 34, 56, .3); border-radius: 6px; padding: 3px 7px; margin-right: 2px; }
  @media (prefers-reduced-motion: reduce) { .blob, .ringanim, #L0 .float, #L2 .shine, #L5 .alone .eq b, .cell.blink .pad { animation: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbb8ef"/><stop offset=".55" stop-color="#f6efe6"/><stop offset="1" stop-color="#bfe6d6"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbb8ef"/><stop offset=".5" stop-color="#8fd3b9"/><stop offset="1" stop-color="#f3d98b"/></linearGradient>
    <linearGradient id="lidsheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
  </defs>
</svg>

<div class="stage step-0" id="stage">

  <!-- 1 導入-2 スマホ -->
  <section class="layer" id="L0">
    <div class="blob blob-main"></div>
    <div class="blob blob-bl"></div>
    <div class="blob blob-tr"></div>
    <svg class="art" viewBox="0 0 1600 900" aria-hidden="true">
      <g class="float">
        <rect x="644" y="300" width="8" height="44" rx="4" fill="#1f2238"/>
        <rect x="644" y="364" width="8" height="76" rx="4" fill="#1f2238"/>
        <rect x="948" y="330" width="8" height="96" rx="4" fill="#1f2238"/>
        <rect x="650" y="160" width="300" height="620" rx="46" fill="#1f2238"/>
        <rect x="662" y="172" width="276" height="596" rx="36" fill="url(#scr)"/>
        <rect x="772" y="188" width="56" height="16" rx="8" fill="#1f2238"/>
        <text class="en" x="800" y="296" text-anchor="middle" font-weight="700" font-size="60" fill="#1f2238">11:07</text>
        <text x="800" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="rgba(31,34,56,.6)">11月7日 土曜日</text>
        <g id="icons"></g>
        <rect x="684" y="688" width="232" height="60" rx="18" fill="rgba(255,255,255,.5)"/>
        <g id="dock"></g>
        <rect x="760" y="754" width="80" height="5" rx="2.5" fill="#1f2238" opacity=".55"/>
      </g>
    </svg>
    <div class="html note" style="left:330px; top:250px"><i style="background:var(--lilac)"></i>ゲーム</div>
    <div class="html note" style="left:1040px; top:380px"><i style="background:var(--peach)"></i>動画</div>
    <div class="html note" style="left:360px; top:560px"><i style="background:var(--mint)"></i>カメラ</div>
  </section>

  <!-- 2 導入-3 中の板 -->
  <section class="layer" id="L1">
    <svg class="art" viewBox="0 0 1600 900" aria-hidden="true" id="boardArt"></svg>
    <div class="html tag">この黒い四角</div>
  </section>

  <!-- 3 導入-4 チップ -->
  <section class="layer" id="L2">
    <svg class="art" viewBox="0 0 1600 900" aria-hidden="true" id="chipArt"></svg>
    <div class="html thumb">
      <div class="caps">Size</div>
      <p>大きさは、つめくらい</p>
      <svg viewBox="0 0 286 150" aria-hidden="true">
        <path d="M30 150 C 30 60, 60 10, 120 8 C 190 6, 230 40, 232 100 L 234 150 Z" fill="#f3c9a8" stroke="#1f2238" stroke-width="5" stroke-linejoin="round"/>
        <path d="M86 74 C 86 36, 110 20, 140 20 C 176 20, 200 40, 200 76 L 198 120 L 88 120 Z" fill="#fbe3cf" stroke="#1f2238" stroke-width="5" stroke-linejoin="round"/>
        <g transform="translate(118 50)"><rect x="-4" y="6" width="58" height="4" fill="#cfc8b8"/><rect x="-4" y="40" width="58" height="4" fill="#cfc8b8"/><rect x="6" y="-4" width="4" height="58" fill="#cfc8b8"/><rect x="40" y="-4" width="4" height="58" fill="#cfc8b8"/><rect x="0" y="0" width="50" height="50" rx="5" fill="#1f2238"/><rect x="4" y="4" width="42" height="42" rx="4" fill="#2a2e4c"/><circle cx="10" cy="10" r="2" fill="#cfc8b8"/></g>
        <text x="258" y="100" text-anchor="middle" font-size="22" font-weight="900" fill="#1f2238">≈1cm</text>
      </svg>
    </div>
  </section>

  <!-- 4 導入-5 チップの中（町の地図） -->
  <section class="layer" id="L3">
    <svg class="art" viewBox="0 0 1600 900" aria-hidden="true" id="mapArt"></svg>
  </section>

  <!-- 5 導入-6 区画の中 -->
  <section class="layer" id="L4">
    <svg class="art" viewBox="0 0 1600 900" aria-hidden="true" id="blockArt"></svg>
    <div class="html hair">
      <div class="caps">How thin</div>
      <p>線は、かみの毛より ずっと細い<small>かみの毛の 1000 分の 1 くらい</small></p>
      <svg viewBox="0 0 352 96" aria-hidden="true">
        <text x="0" y="30" font-size="18" font-weight="700" fill="rgba(31,34,56,.6)">かみの毛</text>
        <line x1="100" y1="24" x2="350" y2="24" stroke="#6b4a2e" stroke-width="20" stroke-linecap="round"/>
        <text x="0" y="78" font-size="18" font-weight="700" fill="rgba(31,34,56,.6)">この線</text>
        <line x1="100" y1="72" x2="350" y2="72" stroke="#8fd3b9" stroke-width="1"/>
        <line x1="100" y1="72" x2="350" y2="72" stroke="#1f2238" stroke-width="0.6"/>
      </svg>
    </div>
  </section>

  /* ---------- 3 チップ 810×810。中にダイ（町の地図）420 ---------- */

  /* ---------- 4 チップの中（町の地図）810。まん中の区画 150 ---------- */
  document.getElementById('mapArt').innerHTML = '<rect x="0" y="0" width="1600" height="900" fill="' + SUB + '"/>' + mapSVG(395, 45, 810, true);

  /* ---------- 5 区画の中 810。まわりの区画も少し見える ---------- */
  (function () {

    s += '<rect x="0" y="0" width="1600" height="900" fill="none"/>';
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(function (d) {
      var bx = 395 + d[0] * 972, by = 45 + d[1] * 972;
      s += '<rect x="' + bx + '" y="' + by + '" width="810" height="810" rx="32" fill="' + BLOCK_COLORS[(d[0] + 2 * d[1] + 4) % 5] + '"/>';
    });
    s += '<g stroke="' + MINT + '" stroke-opacity=".35" stroke-width="16"><line x1="0" y1="-36" x2="1600" y2="-36"/><line x1="0" y1="936" x2="1600" y2="936"/><line x1="314" y1="0" x2="314" y2="900"/><line x1="1286" y1="0" x2="1286" y2="900"/></g>';
    s += blockSVG(395, 45, 810, true);

  /* ---------- 6〜9 マス 1 個 810 → スイッチ ---------- */
  (function () {
    var s = '<rect x="0" y="0" width="1600" height="900" fill="' + DIE + '"/><g class="tr">';
    for (var j = -1; j <= 1; j++) for (var i = -1; i <= 1; i++) if (i || j) s += cellGlyph(395 + i * 810, 45 + j * 810, 810, false);
    s += cellGlyph(395, 45, 810, false) + '</g>';
    s += '<g class="swg"><rect x="395" y="45" width="810" height="810" rx="60" fill="' + PAPER + '" opacity=".06"/>';
    s += '<path class="wire" d="M770 250 H560 V338" fill="none" stroke="' + INK + '" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path class="wire" d="M560 470 V538" fill="none" stroke="' + INK + '" stroke-width="10" stroke-linecap="round"/><path class="wire" d="M830 250 H1040 V530" fill="none" stroke="' + INK + '" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>';
    s += battery(520, 350, 80, 120) + lampSVG(800, 170, 64, 'big') + switchSVG(560, 560, 2, 'big');
    s += '<text class="lbl-off" x="800" y="690" text-anchor="middle" font-size="64" font-weight="900" fill="' + INK + '">止める ＝ <tspan class="en" font-weight="800">OFF</tspan></text>';
    s += '<text class="lbl-on" x="800" y="690" text-anchor="middle" font-size="64" font-weight="900" fill="' + INK + '">通す ＝ <tspan class="en" font-weight="800" fill="' + ACCENT + '">ON</tspan></text></g>';
    document.getElementById('swArt').innerHTML = s;
  })();

  /* ---------- 場面の定義 ---------- */
  // F: 次の場面の中心になる点、Z: その点を何倍にすると次の場面と重なるか
  var LAYERS = [
    { el: document.getElementById('L0'), F: [800, 470], Z: 1.35 },
    { el: document.getElementById('L1'), F: [800, 330], Z: 5.4 },
    { el: document.getElementById('L2'), F: [800, 450], Z: 810 / 420 },
    { el: document.getElementById('L3'), F: [800, 450], Z: 5.4 },
    { el: document.getElementById('L4'), F: [800, 450], Z: 9 },
    { el: document.getElementById('L5'), F: [800, 450], Z: 1 }
  ];
  var STEPS = [
    { who: '導入-2', layer: 0, crumb: 0, size: '大きさ <span class="en">≈ 15 cm</span>', dur: 9000,
      caps: [{ at: 400, html: 'ゲームも、動画も、カメラも、この 1 台で。' }, { at: 4500, html: 'この中が どうなっているのか、<br>どんどん近づいて、のぞいてみよう' }] },
    { who: '導入-3', layer: 1, crumb: 1, size: '', dur: 10000,
      caps: [{ at: 900, html: 'ふたを開けると、部品が びっしり。' }, { at: 4200, html: '一番大事なのは、この<b>黒い四角</b>。' }], timers: [{ at: 4000, cls: 'ring' }] },
    { who: '導入-4', layer: 2, crumb: 2, size: '大きさ <span class="en">≈ 1 cm</span>（つめくらい）', dur: 10000,
      caps: [{ at: 900, html: 'これが <b>チップ</b>。大きさは、つめくらい。' }], timers: [{ at: 2200, cls: 'thumb' }, { at: 5500, cls: 'open' }] },
    { who: '導入-5', layer: 3, crumb: 3, size: '区画 1 つ <span class="en">≈ 1 mm</span>', dur: 10000,
      caps: [{ at: 900, html: '中は……　町の地図みたい。<br><b>区画</b>が たくさん並んでいる' }], timers: [{ at: 3500, cls: 'ring' }] },
    { who: '導入-6', layer: 4, crumb: 4, size: '線の太さ: かみの毛の <span class="en">1/1000</span>', dur: 10000,
      caps: [{ at: 900, html: '細い<b>線</b>と、小さな<b>部品</b>が びっしり。<br>線は、かみの毛より ずっと細い' }], timers: [{ at: 2600, cls: 'hair' }, { at: 3600, cls: 'ring' }] },
    { who: '導入-7', layer: 5, crumb: 5, size: 'ふつうの顕微鏡でも 見えない', dur: 7000,
      caps: [{ at: 1200, html: '一番奥に いたのは……' }] },
    { who: '導入-7', layer: 5, crumb: 5, size: 'ふつうの顕微鏡でも 見えない', dur: 8000, cls: 'sw',
      caps: [{ at: 300, html: '<b>スイッチ 1 個</b>。<small>トランジスタ ── 半導体でできた、とても小さなスイッチ</small>' }] },
    { who: '導入-7', layer: 5, crumb: 5, size: 'ふつうの顕微鏡でも 見えない', dur: 9000, cls: 'sw tog',
      caps: [{ at: 300, html: 'できるのは、電気を <b>通す</b>か、<b>止める</b>か。<br>オンか、オフか。それだけ' }], timers: [{ at: 0, fn: 'toggleStart' }] },
    { who: '導入-7', layer: 5, crumb: 5, size: 'ふつうの顕微鏡でも 見えない', dur: 9000, cls: 'sw tog alone',
      caps: [{ at: 300, html: '1 たす 1 どころか、<br>ひとりでは 何も計算できません' }], timers: [{ at: 0, fn: 'toggleStart' }] }
  ];
  var N = STEPS.length, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- カメラ ---------- */
  var pos = 0, from = 0, to = 0, t0 = 0, dur = 0, animating = false;
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function smooth(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
  function render(p) {
    for (var i = 0; i < LAYERS.length; i++) {
      var L = LAYERS[i], d = p - i, el = L.el, s, cx, cy, op;
      if (d >= 1 || d <= -1) { el.style.visibility = 'hidden'; el.style.opacity = 0; continue; }
      if (d >= 0) { s = Math.pow(L.Z, d); cx = CX + (L.F[0] - CX) * d; cy = CY + (L.F[1] - CY) * d; op = 1; }
      else {
        var P = LAYERS[i - 1], k = d + 1; s = Math.pow(P.Z, k - 1);
        var lx = CX + (P.F[0] - CX) * k, ly = CY + (P.F[1] - CY) * k;
        cx = (lx - P.F[0]) * P.Z + CX; cy = (ly - P.F[1]) * P.Z + CY; op = smooth(.12, .7, k);
      }
      el.style.visibility = 'visible'; el.style.opacity = op;
      el.style.transform = 'matrix(' + s + ',0,0,' + s + ',' + (CX - s * cx) + ',' + (CY - s * cy) + ')';
    }
  }
  function tick(now) {
    var t = dur ? Math.min(1, (now - t0) / dur) : 1;
    pos = from + (to - from) * ease(t); render(pos);
    if (t < 1) requestAnimationFrame(tick); else animating = false;
  }
  function moveTo(layer) {
    if (layer === to && !animating && pos === to) return;
    from = pos; to = layer;
    dur = reduce ? 350 : 2000 * Math.min(1.5, Math.abs(to - from)); t0 = performance.now();
    if (!animating) { animating = true; requestAnimationFrame(tick); }
  }

  /* ---------- 進行 ---------- */
  var stage = document.getElementById('stage'), cap = document.getElementById('cap'), who = document.getElementById('who'), sizeEl = document.getElementById('size'), dots = document.getElementById('dots'), badge = document.getElementById('badge');
  var step = -1, timers = [], loops = [], auto = /[?&]auto\b/.test(location.search), autoTimer = 0;
  var crumbSpans = document.querySelectorAll('#crumb span');
  for (var i = 0; i < N; i++) { var b = document.createElement('button'); b.title = (i + 1) + ' / ' + N + '　' + STEPS[i].who; b.setAttribute('data-i', i); dots.appendChild(b); }

  function clearTimers() { timers.forEach(clearTimeout); timers = []; loops.forEach(clearInterval); loops = []; }
  function later(ms, fn) { timers.push(setTimeout(fn, reduce ? Math.min(ms, 400) : ms)); }
  function showCap(html) { cap.innerHTML = html; cap.classList.remove('show'); void cap.offsetWidth; cap.classList.add('show'); }
  var FX = {
    toggleStart: function () {
      var L = LAYERS[5].el, sw = L.querySelector('.sw'), lamp = L.querySelector('.lamp'), on = L.classList.contains('on');
      function set(v) { on = v; sw.classList.toggle('on', v); lamp.classList.toggle('on', v); L.classList.toggle('on', v); L.querySelectorAll('.wire').forEach(function (w) { w.classList.toggle('live', v); }); }
      later(900, function () { set(!on); loops.push(setInterval(function () { set(!on); }, 1400)); });
    }
  };
  function go(n) {
    n = Math.max(0, Math.min(N - 1, n));
    if (n === step) return;
    step = n;
    var S = STEPS[n];
    clearTimers();
    // 先の場面は初期状態に戻す。今の場面と過去の場面はそのまま（ズームで出ていく間も、ふたは開いたまま）
    for (var i = S.layer + 1; i < LAYERS.length; i++) LAYERS[i].el.classList.remove('ring', 'thumb', 'open', 'hair', 'on');
    if (!/sw/.test(S.cls || '')) { LAYERS[5].el.classList.remove('on'); LAYERS[5].el.querySelectorAll('.on').forEach(function (e) { e.classList.remove('on'); }); LAYERS[5].el.querySelectorAll('.live').forEach(function (e) { e.classList.remove('live'); }); }
    stage.className = 'stage step-' + n + ' ' + (S.cls || '');
    crumbSpans.forEach(function (sp, i) { sp.classList.toggle('now', i === S.crumb); });
    sizeEl.innerHTML = S.size; sizeEl.classList.toggle('show', !!S.size);
    who.textContent = S.who;
    dots.querySelectorAll('button').forEach(function (b, i) { b.classList.toggle('now', i === n); b.classList.toggle('done', i < n); });
    moveTo(S.layer);
    cap.classList.remove('show');
    (S.caps || []).forEach(function (c) { later(c.at, function () { showCap(c.html); }); });
    (S.timers || []).forEach(function (t) { later(t.at, function () { if (t.cls) LAYERS[S.layer].el.classList.add(t.cls); if (t.fn) FX[t.fn](); }); });
    scheduleAuto();
  }
  function scheduleAuto() {
    clearTimeout(autoTimer);
    if (!auto || step >= N - 1) return;
    autoTimer = setTimeout(function () { go(step + 1); }, STEPS[step].dur);
  }
  function setAuto(v) { auto = v; badge.classList.toggle('show', v); document.querySelector('.btn.auto').classList.toggle('on', v); scheduleAuto(); }

  /* ---------- 窓に合わせる・全画面・操作 ---------- */
  function fit() { document.documentElement.style.setProperty('--fit', Math.min(innerWidth / W, innerHeight / H)); }
  addEventListener('resize', fit); fit();
  function toggleFs() {
    var d = document, el = d.documentElement;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (e) { document.addEventListener(e, function () { document.documentElement.classList.toggle('is-fs', !!(document.fullscreenElement || document.webkitFullscreenElement)); }); });
  document.querySelector('.btn.prev').addEventListener('click', function (e) { e.stopPropagation(); go(step - 1); });
  document.querySelector('.btn.next').addEventListener('click', function (e) { e.stopPropagation(); go(step + 1); });
  document.querySelector('.btn.auto').addEventListener('click', function (e) { e.stopPropagation(); setAuto(!auto); });
  document.querySelector('.btn.fs').addEventListener('click', function (e) { e.stopPropagation(); toggleFs(); });
  dots.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; e.stopPropagation(); go(+b.getAttribute('data-i')); });
  document.body.addEventListener('click', function (e) { if (e.target.closest('.nav')) return; go(step + 1); });
  addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case ' ': case 'Enter': case 'ArrowRight': case 'ArrowDown': case 'PageDown': e.preventDefault(); go(step + 1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': e.preventDefault(); go(step - 1); break;
      case 'Home': go(0); break;
      case 'End': go(N - 1); break;
      case 'f': case 'F': toggleFs(); break;
      case 'a': case 'A': setAuto(!auto); break;
      case 'r': case 'R': step = -1; go(0); break;
      default: if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
    }
  });
  render(0); go(0);
  if (auto) setAuto(true);
})();
</script>
